<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="warm" cx="6%" cy="-8%" r="62%">
      <stop offset="0" stop-color="#c8332d" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#c8332d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="104%" cy="108%" r="62%">
      <stop offset="0" stop-color="#2358a5" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#2358a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="docShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="34" stdDeviation="35" flood-color="#2d2314" flood-opacity="0.14"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#c8332d" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <rect width="1920" height="1080" fill="url(#cool)"/>

  <g font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif">
