    <text x="1689" y="283" font-family="SF Mono, Menlo, monospace" font-size="15" letter-spacing="1.5" text-anchor="end" fill="#7a746b">PDF</text>
  </g>
  <line x1="1187" y1="302" x2="1689" y2="302" stroke="#171614" stroke-width="3"/>
  <text x="1187" y="328" font-family="SF Mono, Menlo, monospace" font-size="13" letter-spacing="1.4" fill="#a39b8f">CONTRACT · 2026-1031</text>

  <g fill="#ebe6dc">
    <rect x="1187" y="360" width="462" height="10" rx="5"/>
    <rect x="1187" y="385" width="392" height="10" rx="5"/>
    <rect x="1187" y="410" width="442" height="10" rx="5"/>
    <rect x="1187" y="435" width="321" height="10" rx="5"/>
    <rect x="1187" y="460" width="422" height="10" rx="5"/>
    <rect x="1187" y="485" width="361" height="10" rx="5"/>
    <rect x="1187" y="510" width="452" height="10" rx="5"/>
    <rect x="1187" y="535" width="281" height="10" rx="5"/>
  </g>

  <g transform="rotate(-9 1598 756)" font-family="PingFang SC, Hiragino Sans GB, Noto Sans SC, sans-serif">
