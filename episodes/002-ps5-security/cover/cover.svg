    <text x="100" y="860" font-size="48" fill="#171614">PS5：能玩，不等于能随意控制</text>
    <text x="100" y="970" font-size="36" fill="#68635d">零基础解释 · 自然语速 · 留时间思考</text>
    <g transform="translate(1260 245)">
      <rect x="0" y="0" width="540" height="135" rx="20" fill="#edf3fb" stroke="#2358a5" stroke-width="4"/>
      <rect x="0" y="165" width="540" height="135" rx="20" fill="#fff8e9" stroke="#966200" stroke-width="4"/>
